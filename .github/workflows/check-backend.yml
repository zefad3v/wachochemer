name: Check shared households
on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/check-backend.yml'
  push:
    branches: [codex/shared-household-backend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:database
      - run: npm run test:online
      - run: RECOVERY_RELOAD=1 npm run test:online
      - name: Verify the checked-in browser SDK
        run: |
          npm run build:auth
          git diff --exit-code -- prototype/vendor/
